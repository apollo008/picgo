<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 820" width="1300" height="820">
<defs>
<style>
  .title { font: bold 22px sans-serif; fill: #1E293B; }
  .subtitle { font: bold 14px sans-serif; fill: #334155; }
  .label { font: 12px sans-serif; fill: #1E293B; }
  .sublabel { font: 10px sans-serif; fill: #64748B; }
  .box { rx: 8; ry: 8; stroke-width: 2; }
</style>
<marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
  <polygon points="0 0, 10 3.5, 0 7" fill="#64748B"/>
</marker>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="650" y="38" text-anchor="middle" class="title">ESearch 系统整体架构（多分片 Merger + 多分片 Searcher）</text>
<line x1="60" y1="52" x2="1240" y2="52" stroke="#2B6CB0" stroke-width="4"/>
<rect class="box" x="500" y="68" width="300" height="48" fill="#EBF4FF" stroke="#2B6CB0"/>
<text x="650.0" y="96.0" text-anchor="middle" font-weight="bold" class="label">客户端 / 业务应用层</text>
<rect class="box" x="120" y="140" width="180" height="55" fill="#CCFBF1" stroke="#0D9488"/>
<text x="210.0" y="161.5" text-anchor="middle" font-weight="bold" class="label">Proxy</text>
<text x="210.0" y="179.5" text-anchor="middle" class="sublabel">查询代理</text>
<rect class="box" x="1000" y="140" width="180" height="55" fill="#CCFBF1" stroke="#0D9488"/>
<text x="1090.0" y="161.5" text-anchor="middle" font-weight="bold" class="label">Builder</text>
<text x="1090.0" y="179.5" text-anchor="middle" class="sublabel">离线全量索引构建</text>
<text x="650" y="230" text-anchor="middle" class="subtitle" fill="#2B6CB0">Merger 分片集群（netter Arbiter）</text>
<rect class="box" x="280" y="240" width="220" height="90" fill="#EBF4FF" stroke="#2B6CB0"/>
<text x="390.0" y="279.0" text-anchor="middle" font-weight="bold" class="label">Merger 分片 1</text>
<text x="390.0" y="297.0" text-anchor="middle" class="sublabel">路由 · 扇出 · 合并 · ListRank</text>
<line x1="650" y1="116" x2="390" y2="240" stroke="#2B6CB0" stroke-width="2" marker-end="url(#arrow)"/>
<rect class="box" x="560" y="240" width="220" height="90" fill="#EBF4FF" stroke="#2B6CB0"/>
<text x="670.0" y="279.0" text-anchor="middle" font-weight="bold" class="label">Merger 分片 2</text>
<text x="670.0" y="297.0" text-anchor="middle" class="sublabel">路由 · 扇出 · 合并 · ListRank</text>
<line x1="650" y1="116" x2="670" y2="240" stroke="#2B6CB0" stroke-width="2" marker-end="url(#arrow)"/>
<rect class="box" x="840" y="240" width="220" height="90" fill="#EBF4FF" stroke="#2B6CB0"/>
<text x="950.0" y="279.0" text-anchor="middle" font-weight="bold" class="label">Merger 分片 3</text>
<text x="950.0" y="297.0" text-anchor="middle" class="sublabel">路由 · 扇出 · 合并 · ListRank</text>
<line x1="650" y1="116" x2="950" y2="240" stroke="#2B6CB0" stroke-width="2" marker-end="url(#arrow)"/>
<text x="650" y="380" text-anchor="middle" class="subtitle" fill="#0D9488">Searcher 分片集群（索引 Shard）</text>
<rect class="box" x="220" y="395" width="110" height="70" fill="#CCFBF1" stroke="#0D9488"/>
<text x="275.0" y="424.0" text-anchor="middle" font-weight="bold" class="label">Searcher</text>
<text x="275.0" y="442.0" text-anchor="middle" class="sublabel">分片 {mi*2+si+1}</text>
<line x1="390" y1="330" x2="275" y2="395" stroke="#0D9488" stroke-width="2" marker-end="url(#arrow)"/>
<rect class="box" x="350" y="395" width="110" height="70" fill="#CCFBF1" stroke="#0D9488"/>
<text x="405.0" y="424.0" text-anchor="middle" font-weight="bold" class="label">Searcher</text>
<text x="405.0" y="442.0" text-anchor="middle" class="sublabel">分片 {mi*2+si+1}</text>
<line x1="390" y1="330" x2="405" y2="395" stroke="#0D9488" stroke-width="2" marker-end="url(#arrow)"/>
<rect class="box" x="500" y="395" width="110" height="70" fill="#CCFBF1" stroke="#0D9488"/>
<text x="555.0" y="424.0" text-anchor="middle" font-weight="bold" class="label">Searcher</text>
<text x="555.0" y="442.0" text-anchor="middle" class="sublabel">分片 {mi*2+si+1}</text>
<line x1="670" y1="330" x2="555" y2="395" stroke="#0D9488" stroke-width="2" marker-end="url(#arrow)"/>
<rect class="box" x="630" y="395" width="110" height="70" fill="#CCFBF1" stroke="#0D9488"/>
<text x="685.0" y="424.0" text-anchor="middle" font-weight="bold" class="label">Searcher</text>
<text x="685.0" y="442.0" text-anchor="middle" class="sublabel">分片 {mi*2+si+1}</text>
<line x1="670" y1="330" x2="685" y2="395" stroke="#0D9488" stroke-width="2" marker-end="url(#arrow)"/>
<rect class="box" x="780" y="395" width="110" height="70" fill="#CCFBF1" stroke="#0D9488"/>
<text x="835.0" y="424.0" text-anchor="middle" font-weight="bold" class="label">Searcher</text>
<text x="835.0" y="442.0" text-anchor="middle" class="sublabel">分片 {mi*2+si+1}</text>
<line x1="950" y1="330" x2="835" y2="395" stroke="#0D9488" stroke-width="2" marker-end="url(#arrow)"/>
<rect class="box" x="910" y="395" width="110" height="70" fill="#CCFBF1" stroke="#0D9488"/>
<text x="965.0" y="424.0" text-anchor="middle" font-weight="bold" class="label">Searcher</text>
<text x="965.0" y="442.0" text-anchor="middle" class="sublabel">分片 {mi*2+si+1}</text>
<line x1="950" y1="330" x2="965" y2="395" stroke="#0D9488" stroke-width="2" marker-end="url(#arrow)"/>
<text x="650" y="520" text-anchor="middle" class="subtitle" fill="#7C3AED">Indexlib 索引存储（每个 Searcher 分片独立）</text>
<rect class="box" x="130" y="535" width="180" height="55" fill="#EDE9FE" stroke="#7C3AED"/>
<text x="220.0" y="566.5" text-anchor="middle" font-weight="bold" class="label">倒排</text>
<rect class="box" x="340" y="535" width="180" height="55" fill="#EDE9FE" stroke="#7C3AED"/>
<text x="430.0" y="566.5" text-anchor="middle" font-weight="bold" class="label">正排</text>
<rect class="box" x="550" y="535" width="180" height="55" fill="#EDE9FE" stroke="#7C3AED"/>
<text x="640.0" y="566.5" text-anchor="middle" font-weight="bold" class="label">BKD</text>
<rect class="box" x="760" y="535" width="180" height="55" fill="#EDE9FE" stroke="#7C3AED"/>
<text x="850.0" y="566.5" text-anchor="middle" font-weight="bold" class="label">向量</text>
<rect class="box" x="970" y="535" width="180" height="55" fill="#EDE9FE" stroke="#7C3AED"/>
<text x="1060.0" y="566.5" text-anchor="middle" font-weight="bold" class="label">主键/删除</text>
<rect class="box" x="30" y="300" width="120" height="80" fill="#FFEDD5" stroke="#EA580C"/>
<text x="90.0" y="334.0" text-anchor="middle" font-weight="bold" class="label">esearchrank</text>
<text x="90.0" y="352.0" text-anchor="middle" class="sublabel">排序插件 DLL</text>
<line x1="1090" y1="195" x2="900" y2="430" stroke="#0D9488" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1050" y="320" class="sublabel" transform="rotate(-30 1050 320)">增量推送</text>
<rect class="box" x="60" y="640" width="1180" height="140" fill="#F8FAFC" stroke="#CBD5E1"/>
<text x="120" y="675" class="label" font-weight="bold">架构要点：</text>
<text x="120" y="700" class="sublabel">• Merger 分片：接收检索请求，按一致性哈希扇出到多个 Searcher 分片，合并各分片 TopDocs</text>
<text x="120" y="722" class="sublabel">• Searcher 分片：每个分片是一份完整索引数据的子集，内含多生命周期段（写段/读段）</text>
<text x="120" y="744" class="sublabel">• 水平扩展：通过增加 Merger 分片和 Searcher 分片数量实现查询与存储的线性扩展</text>
<text x="120" y="766" class="sublabel">• 协议支持：1.0 文本 DSL（ProtocolType=12）与 2.0 Protobuf（ProtocolType=16）双协议</text>
</svg>