<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
<defs>
<style>
  .title { font: bold 22px sans-serif; fill: #1E293B; }
  .subtitle { font: bold 14px sans-serif; fill: #334155; }
  .label { font: 12px sans-serif; fill: #1E293B; }
  .sublabel { font: 10px sans-serif; fill: #64748B; }
  .box { rx: 8; ry: 8; stroke-width: 2; }
</style>
<marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
  <polygon points="0 0, 10 3.5, 0 7" fill="#64748B"/>
</marker>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="600" y="40" text-anchor="middle" class="title">ESearch 实时索引 · 多级段生命周期</text>
<rect class="box" x="80" y="100" width="160" height="80" fill="#FFEDD5" stroke="#EA580C"/>
<text x="160.0" y="134.0" text-anchor="middle" font-weight="bold" class="label">3秒段</text>
<text x="160.0" y="152.0" text-anchor="middle" class="sublabel">实时写入</text>
<line x1="240" y1="140" x2="265" y2="140" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
<rect class="box" x="265" y="100" width="160" height="80" fill="#CCFBF1" stroke="#0D9488"/>
<text x="345.0" y="134.0" text-anchor="middle" font-weight="bold" class="label">15分钟段</text>
<text x="345.0" y="152.0" text-anchor="middle" class="sublabel">快速合并</text>
<line x1="425" y1="140" x2="450" y2="140" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
