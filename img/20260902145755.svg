<text x="900.0" y="152.0" text-anchor="middle" class="sublabel">月级合并</text>
<line x1="980" y1="140" x2="1005" y2="140" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
<rect class="box" x="1005" y="100" width="160" height="80" fill="#F1F5F9" stroke="#64748B"/>
