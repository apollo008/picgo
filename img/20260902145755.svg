<text x="1085.0" y="152.0" text-anchor="middle" class="sublabel">离线推送</text>
<rect class="box" x="80" y="260" width="220" height="70" fill="#FFEDD5" stroke="#EA580C"/>
<text x="190.0" y="289.0" text-anchor="middle" font-weight="bold" class="label">WriterSegment</text>
<text x="190.0" y="307.0" text-anchor="middle" class="sublabel">内存写段 · Updater写入</text>
<rect class="box" x="380" y="260" width="260" height="70" fill="#CCFBF1" stroke="#0D9488"/>
<text x="510.0" y="289.0" text-anchor="middle" font-weight="bold" class="label">WriteToReaderSegConverter</text>
<text x="510.0" y="307.0" text-anchor="middle" class="sublabel">写段→读段转换 · 可见性统计</text>
<rect class="box" x="720" y="260" width="260" height="70" fill="#EBF4FF" stroke="#2B6CB0"/>
<text x="850.0" y="289.0" text-anchor="middle" font-weight="bold" class="label">Segment Merger</text>
<text x="850.0" y="307.0" text-anchor="middle" class="sublabel">后台段合并 · TieredMergePolicy</text>
<line x1="190" y1="260" x2="140" y2="180" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="300" y1="295" x2="140" y2="180" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="510" y1="295" x2="230" y2="180" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="850" y1="295" x2="600" y2="180" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
<rect class="box" x="300" y="400" width="600" height="60" fill="#D1FAE5" stroke="#059669"/>
<text x="600.0" y="434.0" text-anchor="middle" font-weight="bold" class="label">毫秒级可见性: Realtime_Index_Config.Enabled → 文档 birth_time 到可检索延迟监控</text>
</svg>