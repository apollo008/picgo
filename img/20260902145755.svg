<line x1="610" y1="140" x2="635" y2="140" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
<rect class="box" x="635" y="100" width="160" height="80" fill="#EDE9FE" stroke="#7C3AED"/>
<text x="715.0" y="134.0" text-anchor="middle" font-weight="bold" class="label">1天段</text>
<text x="715.0" y="152.0" text-anchor="middle" class="sublabel">日级合并</text>
<line x1="795" y1="140" x2="820" y2="140" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
<rect class="box" x="820" y="100" width="160" height="80" fill="#D1FAE5" stroke="#059669"/>
