<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
<defs>
<style>
  .title { font: bold 22px sans-serif; fill: #1E293B; }
  .subtitle { font: bold 14px sans-serif; fill: #334155; }
  .label { font: 12px sans-serif; fill: #1E293B; }
  .sublabel { font: 10px sans-serif; fill: #64748B; }
  .box { rx: 8; ry: 8; stroke-width: 2; }
</style>
<marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
  <polygon points="0 0, 10 3.5, 0 7" fill="#64748B"/>
</marker>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="600" y="38" text-anchor="middle" class="title">ESearch 高效索引写入策略</text>
<line x1="60" y1="52" x2="1140" y2="52" stroke="#2B6CB0" stroke-width="3"/>
<rect class="box" x="450" y="70" width="300" height="50" fill="#EBF4FF" stroke="#2B6CB0"/>
<text x="600.0" y="89.0" text-anchor="middle" font-weight="bold" class="label">文档流水接入</text>
<text x="600.0" y="107.0" text-anchor="middle" class="sublabel">Builder 全量 / Updater 实时增量</text>
<rect class="box" x="80" y="160" width="280" height="80" fill="#CCFBF1" stroke="#0D9488"/>
<text x="220.0" y="194.0" text-anchor="middle" font-weight="bold" class="label">Updater 线程池</text>
<text x="220.0" y="212.0" text-anchor="middle" class="sublabel">多线程并行消费
MaxProcessBatchDocCount</text>
<rect class="box" x="430" y="160" width="280" height="80" fill="#FFEDD5" stroke="#EA580C"/>
<text x="570.0" y="194.0" text-anchor="middle" font-weight="bold" class="label">WriterSegment</text>
<text x="570.0" y="212.0" text-anchor="middle" class="sublabel">内存写段
倒排+正排+向量</text>
<rect class="box" x="780" y="160" width="280" height="80" fill="#EDE9FE" stroke="#7C3AED"/>
<text x="920.0" y="194.0" text-anchor="middle" font-weight="bold" class="label">WriteToReaderSegConverter</text>
<text x="920.0" y="212.0" text-anchor="middle" class="sublabel">独立线程
写段转读段</text>
<line x1="600" y1="120" x2="220" y2="160" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="600" y1="120" x2="570" y2="160" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="570" y1="240" x2="920" y2="160" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
<rect class="box" x="80" y="300" width="1040" height="100" fill="#EBF4FF" stroke="#2B6CB0"/>
<text x="600" y="330" text-anchor="middle" class="subtitle" fill="#2B6CB0">段合并子系统（Segment Merger）</text>
<rect class="box" x="100" y="345" width="180" height="45" fill="#FFFFFF" stroke="#2B6CB0"/>
<text x="190.0" y="361.5" text-anchor="middle" font-weight="bold" class="label">锁解耦机制</text>
<text x="190.0" y="379.5" text-anchor="middle" class="sublabel">Updater 与 Merger
独立队列暂存</text>
<rect class="box" x="300" y="345" width="180" height="45" fill="#FFFFFF" stroke="#2B6CB0"/>
<text x="390.0" y="361.5" text-anchor="middle" font-weight="bold" class="label">并行合并</text>
<text x="390.0" y="379.5" text-anchor="middle" class="sublabel">倒排与正排
双线程并行</text>
<rect class="box" x="500" y="345" width="180" height="45" fill="#FFFFFF" stroke="#2B6CB0"/>
<text x="590.0" y="361.5" text-anchor="middle" font-weight="bold" class="label">小段优先策略</text>
<text x="590.0" y="379.5" text-anchor="middle" class="sublabel">按段级别
优先合并小段</text>
<rect class="box" x="700" y="345" width="180" height="45" fill="#FFFFFF" stroke="#2B6CB0"/>
<text x="790.0" y="361.5" text-anchor="middle" font-weight="bold" class="label">TieredMergePolicy</text>
<text x="790.0" y="379.5" text-anchor="middle" class="sublabel">分层段合并
Lucene 8.10</text>
<rect class="box" x="900" y="345" width="180" height="45" fill="#FFFFFF" stroke="#2B6CB0"/>
<text x="990.0" y="361.5" text-anchor="middle" font-weight="bold" class="label">多写段批量转读</text>
<text x="990.0" y="379.5" text-anchor="middle" class="sublabel">多 Updater 写段
一次转一个读段</text>
<rect class="box" x="60" y="440" width="520" height="90" fill="#D1FAE5" stroke="#059669"/>
<text x="320.0" y="479.0" text-anchor="middle" font-weight="bold" class="label">倒排+正排实时写入吞吐</text>
<text x="320.0" y="497.0" text-anchor="middle" class="sublabel">1000+ doc/s（主搜房集群 700 doc/s）</text>
<rect class="box" x="620" y="440" width="520" height="90" fill="#D1FAE5" stroke="#059669"/>
<text x="880.0" y="479.0" text-anchor="middle" font-weight="bold" class="label">HNSW 向量写入吞吐</text>
<text x="880.0" y="497.0" text-anchor="middle" class="sublabel">952+ doc/s（128维，hnswlib 多线程）</text>
<rect class="box" x="60" y="560" width="1080" height="90" fill="#F8FAFC" stroke="#CBD5E1"/>
<text x="600" y="590" text-anchor="middle" class="subtitle">关键配置参数</text>
<text x="200" y="620" text-anchor="middle" class="sublabel">UpdaterThreadCount: 4（可配）</text>
<text x="500" y="620" text-anchor="middle" class="sublabel">SegmentHandle_OnceMax_Threads: 10</text>
<text x="800" y="620" text-anchor="middle" class="sublabel">MaxDoc_PerMemSeg: 400000</text>
<text x="1050" y="620" text-anchor="middle" class="sublabel">Realtime_Index_Config.Enabled</text>
</svg>